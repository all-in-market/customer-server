name: Harness Skill Check

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  harness-skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .codex harness skill is a forwarding stub
        run: |
          test -f .agents/skills/harness/SKILL.md
          test -f .codex/skills/harness/SKILL.md
          grep -q ".agents/skills/harness/SKILL.md" .codex/skills/harness/SKILL.md
          ! cmp -s .agents/skills/harness/SKILL.md .codex/skills/harness/SKILL.md
