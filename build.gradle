plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.4'
}

ext {
    snippetsDir = file('build/generated-snippets')
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'all-in-market'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Flyway
    runtimeOnly 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // BOM
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security & JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-orgjson:0.12.6'
    runtimeOnly 'org.json:json:20240303'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Retry
    implementation 'org.springframework.retry:spring-retry:2.0.9'

    // datafaker
    implementation 'net.datafaker:datafaker:2.0.2'

    // querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // monitoring (Cloudwatch)
    implementation 'io.micrometer:micrometer-registry-cloudwatch2'
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.0.0')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-metrics'

    // monitoring (Prometheus)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // monitoring (K6)
    //implementation 'io.micrometer:micrometer-registry-influx'

    // s3 image upload
    implementation 'software.amazon.awssdk:s3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    runtimeOnly 'org.postgresql:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    outputs.dir snippetsDir
}

asciidoctor {
    inputs.dir snippetsDir
    dependsOn test
}

bootJar {
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}/html5") {
        into 'static/docs'
    }
}

// ---------------------------------------------------------------------------
// PIT 뮤테이션 테스트
//
// gradle-pitest-plugin(최신 1.15.0 / 2023-09)은 Gradle 9 지원이 미검증이라
// PIT CLI를 직접 호출한다. check/build 체인에는 연결하지 않는다.
//
// JavaExec을 쓰지 않는 이유: 클래스패스 엔트리가 325개라 Gradle이 Windows에서
// pathing jar로 우회하는데, 그러면 PIT가 자기 에이전트 클래스
// (org.pitest.boot.HotSwapAgent)를 리소스로 못 읽어 기동에 실패한다.
// 대신 java @argfile 로 전체 클래스패스를 직접 넘긴다.
//
//   ./gradlew mutationTest                          # DEFAULTS 뮤테이터
//   ./gradlew mutationTest -PpitMutators=STRONGER   # 더 엄격한 세트
// ---------------------------------------------------------------------------
configurations {
    pitest
}

dependencies {
    pitest 'org.pitest:pitest-command-line:1.25.9'
    pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
}

// 2026-08-25에 추가/보강된 테스트가 커버하는 프로덕션 클래스 29개.
// src/test 의 *Test.java 에서 도출했다.
def pitTargets = [
        'buyer.auth.service.BuyerAuthService',
        'buyer.order.facade.BuyerPaymentOrderFacade',
        'buyer.order.service.OrderValidator',
        'buyer.order.service.StockReleaseService',
        'buyer.payment.facade.BuyerPaymentFacade',
        'buyer.payment.service.PaymentRetryService',
        'buyer.refund.service.BuyerRefundService',
        'common.outbox.service.DashboardOutboxService',
        'common.outbox.service.HistoryOutboxService',
        'common.scheduler.DashboardOutboxScheduler',
        'common.scheduler.OrderExpiryScheduler',
        'domain.cartitem.entity.CartItem',
        'domain.order.enums.OrderStatus',
        'domain.payment.enums.PaymentStatus',
        'domain.payout.entity.Payout',
        'domain.payout.enums.PayoutStatus',
        'domain.product.entity.Product',
        'domain.refund.entity.Refund',
        'domain.refund.enums.RefundStatus',
        'domain.sellerdashboard.entity.SellerDashboard',
        'domain.settlement.entity.Settlement',
        'domain.transactionhistory.enums.TransactionStatus',
        'seller.auth.service.SellerAuthService',
        'seller.dashboard.service.DashboardRowCreatorService',
        'seller.dashboard.service.SellerDashboardProcessor',
        'seller.me.service.SellerMeService',
        'seller.payout.service.SellerPayoutFailHandler',
        'seller.payout.service.SellerPayoutProcessor',
        'seller.payout.service.SellerPayoutService',
].collect { 'com.example.allinmarket.' + it }

def pitMutators = providers.gradleProperty('pitMutators').getOrElse('DEFAULTS')
def pitReportDir = layout.buildDirectory.dir(
        pitMutators == 'DEFAULTS' ? 'reports/pitest' : 'reports/pitest-' + pitMutators.toLowerCase())

tasks.register('pitArgFile') {
    group = 'verification'
    description = 'PIT CLI 실행용 java @argfile 을 생성한다'
    dependsOn tasks.named('testClasses')

    def argFile = layout.buildDirectory.file('pit-args.txt')
    def cp = configurations.pitest + sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    def reportDir = pitReportDir
    def mutators = pitMutators
    def srcDir = file('src/main/java')
    def targets = pitTargets

    inputs.files(cp)
    outputs.file(argFile)

    doLast {
        // argfile 안에서 역슬래시는 이스케이프 문자라 슬래시로 바꾼다
        def slash = { String v -> v.replace(File.separator, '/') }
        argFile.get().asFile.text = [
                '-cp "' + slash(cp.asPath) + '"',
                '-XX:+EnableDynamicAgentLoading',
                '-Xmx2g',
                '-Dspring.profiles.active=test',
                '-Dfile.encoding=UTF-8',
                'org.pitest.mutationtest.commandline.MutationCoverageReport',
                '--reportDir "' + slash(reportDir.get().asFile.absolutePath) + '"',
                '--sourceDirs "' + slash(srcDir.absolutePath) + '"',
                '--targetClasses ' + targets.join(','),
                '--targetTests ' + targets.collect { it + 'Test*' }.join(','),
                '--excludedClasses *.Q*,*Config,*.dto.*',
                '--excludedTestClasses *ConcurrencyTest,*ApplicationTests,*MigrationTest',
                '--outputFormats HTML,XML,CSV',
                '--timestampedReports false',
                '--mutators ' + mutators,
                '--threads 4',
                '--failWhenNoMutations false',
        ].join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('mutationTest', Exec) {
    group = 'verification'
    description = '오늘 추가한 테스트가 커버하는 29개 클래스에 PIT 뮤테이션 테스트를 실행한다'
    dependsOn tasks.named('pitArgFile')

    def javaHome = javaToolchains.launcherFor(java.toolchain).get()
            .executablePath.asFile.absolutePath
    def argFile = layout.buildDirectory.file('pit-args.txt')

    commandLine javaHome, '@' + argFile.get().asFile.absolutePath

    doLast {
        logger.lifecycle('PIT 리포트: {}', pitReportDir.get().asFile.absolutePath + '/index.html')
    }
}
