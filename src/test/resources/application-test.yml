spring:
  sql:
    init:
      mode: never  # 테스트 시 SQL 초기화 스크립트 실행 안 함
  flyway:
    enabled: false  # 테스트 시 Flyway 마이그레이션 비활성화 (H2가 PostgreSQL 문법 미지원)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1  # 인메모리 H2 DB, PostgreSQL 호환 모드
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트 시작 시 테이블 생성, 종료 시 삭제
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect  # H2 DB에 맞는 방언 설정
    defer-datasource-initialization: false

jwt:
  secret: VtHcoEqCTwJ981b7wHL5yb57mwhlE8UjzYhFu3vd5M1 # 테스트 전용 고정값 사용
  expiration: 3600000  # 액세스 토큰 만료 시간 (단위: ms, 3600000 = 1시간)

app:
  init:
    admin:
      enabled: false

notification-server:
  url: http://localhost:8083

notification:
  auth:
    client-id: mock-customer-server
    secret: Z9OSOWEIkhqMOG3veTR3xgkXOzbogWFGF0MnJTXOk66 # 테스트 전용 고정값